<svg width="1440" height="1420" viewBox="0 0 1440 1420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #FAFAF9; }
    .card { fill: #FFFFFF; stroke: #E3E1DD; stroke-width: 1.5; }
    .title { font: 700 40px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; }
    .subtitle { font: 400 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6B7280; }
    .section-head { font: 700 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .body { font: 400 16.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #383D46; }
    .diagbox { fill: #FFFFFF; stroke-width: 2; rx: 10; }
    .diagtext { font: 700 14.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; text-anchor: middle; }
    .diagsub { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6B7280; text-anchor: middle; }
    .eqtext { font: 700 15px "Cambria Math", Georgia, serif; fill: #1F2430; text-anchor: middle; }
    .arrowlabel { font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8A6D3B; text-anchor: middle; }
    .badge { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EE854A"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="1420"/>

  <!-- Header -->
  <text x="60" y="66" class="title">LoRA</text>
  <text x="60" y="96" class="subtitle">Low-Rank Adaptation of Large Language Models · ICLR 2022 · Microsoft</text>
  <text x="60" y="122" class="subtitle">arXiv:2106.09685</text>
  <rect x="1160" y="48" width="220" height="36" rx="18" fill="#E1F0E3" stroke="#4C8C5B"/>
  <text x="1270" y="71" text-anchor="middle" class="badge" fill="#2F6B3D">CODE: RELEASED &amp; USABLE</text>
  <line x1="60" y1="145" x2="1380" y2="145" stroke="#E3E1DD" stroke-width="2"/>

  <!-- Row 1: PROBLEM / NOVELTY -->
  <rect class="card" x="60" y="170" width="640" height="310" rx="14"/>
  <text x="88" y="212" class="section-head" fill="#D65F5F">PROBLEM</text>
  <text x="88" y="248" class="body">– Full fine-tuning updates ALL params per task —</text>
  <text x="100" y="270" class="body">for GPT-3 175B, storing/serving each fine-tuned</text>
  <text x="100" y="292" class="body">copy costs as much as the base model.</text>
  <text x="88" y="326" class="body">– Adapters add sequential compute → real</text>
  <text x="100" y="348" class="body">inference latency (+20-30% at batch size 1).</text>
  <text x="88" y="382" class="body">– Prefix-tuning eats into sequence length and</text>
  <text x="100" y="404" class="body">is hard to optimize (non-monotonic in params).</text>

  <rect class="card" x="740" y="170" width="640" height="310" rx="14"/>
  <text x="768" y="212" class="section-head" fill="#4878D0">NOVELTY</text>
  <text x="768" y="248" class="body">– Reparametrize the weight UPDATE, not the</text>
  <text x="780" y="270" class="body">weight: ∆W = BA, low-rank (r ≪ d,k), while W0</text>
  <text x="780" y="292" class="body">stays completely frozen.</text>
  <text x="768" y="326" class="body">– "Zero inference latency by construction":</text>
  <text x="780" y="348" class="body">W0+BA merges into one matrix at deploy time —</text>
  <text x="780" y="370" class="body">unlike adapters, no added depth.</text>
  <text x="768" y="404" class="body">– Same frozen backbone, many tiny {A,B} pairs —</text>
  <text x="780" y="426" class="body">swapping tasks means swapping a few MB, not</text>
  <text x="780" y="448" class="body">redeploying a 350GB model.</text>

  <!-- Row 2: ARCHITECTURE -->
  <rect class="card" x="60" y="510" width="1320" height="410" rx="14"/>
  <text x="88" y="552" class="section-head" fill="#EE854A">CORE IDEA — REPARAMETRIZATION (Fig. 1 / Eq. 3)</text>

  <!-- input x -->
  <rect class="diagbox" x="90" y="655" width="110" height="60" stroke="#797979"/>
  <text x="145" y="691" class="diagtext">input x</text>

  <!-- W0 box (frozen, top path) -->
  <rect class="diagbox" x="320" y="590" width="280" height="90" stroke="#4878D0"/>
  <text x="460" y="622" class="diagtext">Pretrained Weight W0</text>
  <text x="460" y="642" class="diagsub">d × k</text>
  <text x="460" y="660" class="diagsub" font-weight="700" fill="#4878D0">FROZEN — no gradient</text>

  <!-- A, B boxes (trainable, bottom path) -->
  <rect class="diagbox" x="320" y="740" width="130" height="70" stroke="#EE854A"/>
  <text x="385" y="768" class="diagtext">A ~ N(0,σ²)</text>
  <text x="385" y="788" class="diagsub">r × k, trainable</text>

  <rect class="diagbox" x="470" y="740" width="130" height="70" stroke="#EE854A"/>
  <text x="535" y="768" class="diagtext">B = 0 (init)</text>
  <text x="535" y="788" class="diagsub">d × r, trainable</text>

  <!-- arrows: x -> W0, x -> A, A -> B -->
  <line x1="200" y1="675" x2="320" y2="625" stroke="#797979" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="200" y1="695" x2="320" y2="775" stroke="#797979" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="450" y1="775" x2="470" y2="775" stroke="#EE854A" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- merge node -->
  <circle cx="655" cy="685" r="20" fill="#FFFFFF" stroke="#EE854A" stroke-width="2.5"/>
  <text x="655" y="693" text-anchor="middle" font-size="20" font-weight="700" fill="#EE854A">+</text>
  <line x1="600" y1="630" x2="638" y2="672" stroke="#4878D0" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="600" y1="770" x2="638" y2="698" stroke="#EE854A" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- output h box -->
  <rect class="diagbox" x="700" y="640" width="330" height="90" stroke="#EE854A"/>
  <text x="865" y="675" class="eqtext">h = W0x + (α⁄r)·BAx</text>
  <text x="865" y="700" class="diagsub">only ∆W (i.e. A,B) receives gradients</text>
  <text x="865" y="716" class="diagsub">applied mainly to Wq, Wv (Sec. 4.2)</text>
  <line x1="675" y1="685" x2="696" y2="685" stroke="#EE854A" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- two deployment outcome boxes -->
  <line x1="865" y1="730" x2="865" y2="775" stroke="#6ACC64" stroke-width="2"/>
  <line x1="865" y1="775" x2="775" y2="775" stroke="#6ACC64" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="865" y1="775" x2="1075" y2="775" stroke="#6ACC64" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect class="diagbox" x="620" y="800" width="290" height="90" stroke="#6ACC64"/>
  <text x="765" y="830" class="diagtext">Deploy: merge W = W0+BA</text>
  <text x="765" y="850" class="diagsub">same shape as W0 —</text>
  <text x="765" y="866" class="diagsub">zero extra inference latency</text>

  <rect class="diagbox" x="960" y="800" width="290" height="90" stroke="#6ACC64"/>
  <text x="1105" y="830" class="diagtext">Multi-task: swap tiny {A,B}</text>
  <text x="1105" y="850" class="diagsub">share W0 in VRAM —</text>
  <text x="1105" y="866" class="diagsub">task switch costs a few MB</text>

  <text x="88" y="905" class="body" fill="#6B7280">A is Gaussian-initialized, B is zero-initialized, so ∆W = BA = 0 at the very start of training — the LoRA branch begins as a no-op.</text>

  <!-- Row 3: HARDEST PART / EVIDENCE -->
  <rect class="card" x="60" y="940" width="640" height="320" rx="14"/>
  <text x="88" y="982" class="section-head" fill="#956CB4">HARDEST PART</text>
  <text x="88" y="1018" class="body">– The reparametrization is trivial (3 lines of</text>
  <text x="100" y="1040" class="body">linear algebra) — the real work is Sec. 7's</text>
  <text x="100" y="1062" class="body">SVD subspace-similarity analysis (Grassmann</text>
  <text x="100" y="1084" class="body">distance, Eq. 4) that PROVES "low intrinsic</text>
  <text x="100" y="1106" class="body">rank," not just reports benchmark scores.</text>
  <text x="88" y="1140" class="body">– Distinguishing Sec. 1's "hypothesis" from</text>
  <text x="100" y="1162" class="body">Sec. 7's evidence-backed finding — r=1 being</text>
  <text x="100" y="1184" class="body">competitive is easy to over-claim without it.</text>

  <rect class="card" x="740" y="940" width="640" height="320" rx="14"/>
  <text x="768" y="982" class="section-head" fill="#4C8C5B">EVIDENCE</text>
  <text x="768" y="1018" class="body">– Up to 10,000× fewer trainable params, 3× less</text>
  <text x="780" y="1040" class="body">GPU memory on GPT-3 175B (1.2TB→350GB VRAM);</text>
  <text x="780" y="1062" class="body">25% faster training.</text>
  <text x="768" y="1096" class="body">– On-par or better than full fine-tuning across</text>
  <text x="780" y="1118" class="body">RoBERTa, DeBERTa, GPT-2, GPT-3 (Tables 2-4).</text>
  <text x="768" y="1152" class="body">– Amplification factor ≈20× at r=4 (Table 7):</text>
  <text x="780" y="1174" class="body">∆W amplifies task-specific directions already</text>
  <text x="780" y="1196" class="body">in W but not emphasized by it.</text>

  <!-- Footer: code status -->
  <rect x="60" y="1284" width="1320" height="96" rx="14" fill="#E1F0E3" stroke="#4C8C5B"/>
  <text x="88" y="1316" class="section-head" fill="#2F6B3D">CODE / GITHUB</text>
  <text x="88" y="1344" class="body">github.com/microsoft/LoRA — official Microsoft repo, actually usable: PyTorch integration package plus implementations</text>
  <text x="88" y="1366" class="body">and checkpoints for RoBERTa, DeBERTa, and GPT-2. The first genuinely reproducible paper in this reading list.</text>
</svg>
