<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 990" font-family="Helvetica, Arial, sans-serif">
  <rect width="1700" height="990" fill="#ffffff"/>

  <!-- Title -->
  <rect x="0" y="0" width="1700" height="72" fill="#1a3a8f"/>
  <text x="850" y="34" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">EMMA: End-to-End Multimodal Model for Autonomous Driving</text>
  <text x="850" y="58" text-anchor="middle" fill="#cfe0ff" font-size="15">Waymo · arXiv 2410.23262 · Gemini 微调 · 驾驶即视觉问答(Driving as VQA)</text>

  <!-- Warning band -->
  <rect x="0" y="72" width="1700" height="56" fill="#fff3cd"/>
  <text x="30" y="106" fill="#7a5b00" font-size="17" font-weight="bold">⚠ "Long-tail Reasoning" 不是正式的第三任务——论文原文称为 "Generalizability"，是 §3.6 定性可视化展示的涌现能力，没有独立训练目标/基准，presentation 时不要说成三个并列训练任务</text>

  <!-- Panel B: Table 4 CoT ablation -->
  <text x="30" y="166" fill="#111827" font-size="19" font-weight="bold">Table 4 · CoT 消融实验(§3.3)</text>

  <g font-size="14">
    <!-- header row -->
    <rect x="30" y="186" width="150" height="50" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="105" y="216" text-anchor="middle" font-size="12">Scene description</text>
    <rect x="180" y="186" width="150" height="50" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="255" y="216" text-anchor="middle" font-size="12">Critical object</text>
    <rect x="330" y="186" width="150" height="50" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="405" y="216" text-anchor="middle" font-size="12">Meta decision</text>
    <rect x="480" y="186" width="170" height="50" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="565" y="216" text-anchor="middle" font-size="12">Behavior description</text>
    <rect x="650" y="186" width="200" height="50" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="750" y="208" text-anchor="middle" font-size="11">Relative improvement</text>
    <text x="750" y="224" text-anchor="middle" font-size="11">over baseline e2e</text>

    <!-- row1 -->
    <rect x="30" y="236" width="150" height="46" fill="#d1fae5"/><text x="105" y="264" text-anchor="middle" font-size="18">✓</text>
    <rect x="180" y="236" width="150" height="46" fill="#ffffff"/><text x="255" y="264" text-anchor="middle" font-size="18">✗</text>
    <rect x="330" y="236" width="150" height="46" fill="#ffffff"/><text x="405" y="264" text-anchor="middle" font-size="18">✗</text>
    <rect x="480" y="236" width="170" height="46" fill="#ffffff"/><text x="565" y="264" text-anchor="middle" font-size="18">✗</text>
    <rect x="650" y="236" width="200" height="46" fill="#ffffff" stroke="#d1d5db"/><text x="750" y="264" text-anchor="middle" font-size="16" font-weight="bold">+0.0%</text>

    <!-- row2 -->
    <rect x="30" y="282" width="150" height="46" fill="#ffffff"/><text x="105" y="310" text-anchor="middle" font-size="18">✗</text>
    <rect x="180" y="282" width="150" height="46" fill="#d1fae5"/><text x="255" y="310" text-anchor="middle" font-size="18">✓</text>
    <rect x="330" y="282" width="150" height="46" fill="#ffffff"/><text x="405" y="310" text-anchor="middle" font-size="18">✗</text>
    <rect x="480" y="282" width="170" height="46" fill="#ffffff"/><text x="565" y="310" text-anchor="middle" font-size="18">✗</text>
    <rect x="650" y="282" width="200" height="46" fill="#ffffff" stroke="#d1d5db"/><text x="750" y="310" text-anchor="middle" font-size="16" font-weight="bold">+1.5%</text>

    <!-- row3 -->
    <rect x="30" y="328" width="150" height="46" fill="#ffffff"/><text x="105" y="356" text-anchor="middle" font-size="18">✗</text>
    <rect x="180" y="328" width="150" height="46" fill="#ffffff"/><text x="255" y="356" text-anchor="middle" font-size="18">✗</text>
    <rect x="330" y="328" width="150" height="46" fill="#d1fae5"/><text x="405" y="356" text-anchor="middle" font-size="18">✓</text>
    <rect x="480" y="328" width="170" height="46" fill="#ffffff"/><text x="565" y="356" text-anchor="middle" font-size="18">✗</text>
    <rect x="650" y="328" width="200" height="46" fill="#ffffff" stroke="#d1d5db"/><text x="750" y="356" text-anchor="middle" font-size="16" font-weight="bold">+3.0%</text>

    <!-- row4 -->
    <rect x="30" y="374" width="150" height="46" fill="#ffffff"/><text x="105" y="402" text-anchor="middle" font-size="18">✗</text>
    <rect x="180" y="374" width="150" height="46" fill="#d1fae5"/><text x="255" y="402" text-anchor="middle" font-size="18">✓</text>
    <rect x="330" y="374" width="150" height="46" fill="#d1fae5"/><text x="405" y="402" text-anchor="middle" font-size="18">✓</text>
    <rect x="480" y="374" width="170" height="46" fill="#ffffff"/><text x="565" y="402" text-anchor="middle" font-size="18">✗</text>
    <rect x="650" y="374" width="200" height="46" fill="#ffffff" stroke="#d1d5db"/><text x="750" y="402" text-anchor="middle" font-size="16" font-weight="bold">+5.7%</text>

    <!-- row5 -->
    <rect x="30" y="420" width="150" height="46" fill="#ffffff"/><text x="105" y="448" text-anchor="middle" font-size="18">✗</text>
    <rect x="180" y="420" width="150" height="46" fill="#d1fae5"/><text x="255" y="448" text-anchor="middle" font-size="18">✓</text>
    <rect x="330" y="420" width="150" height="46" fill="#d1fae5"/><text x="405" y="448" text-anchor="middle" font-size="18">✓</text>
    <rect x="480" y="420" width="170" height="46" fill="#d1fae5"/><text x="565" y="448" text-anchor="middle" font-size="18">✓</text>
    <rect x="650" y="420" width="200" height="46" fill="#bbf7d0" stroke="#d1d5db"/><text x="750" y="448" text-anchor="middle" font-size="17" font-weight="bold">+6.7%</text>

    <rect x="30" y="186" width="820" height="280" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  </g>
  <text x="30" y="490" font-size="13.5" fill="#374151">全部四项叠加,规划质量提升 6.7%;Meta Decision 单独贡献最大(+3.0%),其次是 Critical Object(+1.5%)。</text>

  <!-- Panel C: Figure 4 data scaling -->
  <text x="890" y="166" fill="#111827" font-size="19" font-weight="bold">Figure 4 · 数据规模缩放曲线(§3.3)</text>
  <text x="890" y="188" font-size="13" fill="#555">y = eval perplexity(越低越好,越准) ／ x = training FLOPs(对数刻度)</text>

  <g>
    <rect x="890" y="200" width="760" height="330" fill="#f3f4f6" stroke="#9ca3af"/>
    <line x1="890" y1="280" x2="1650" y2="280" stroke="#d1d5db"/>
    <line x1="890" y1="360" x2="1650" y2="360" stroke="#d1d5db"/>
    <line x1="890" y1="440" x2="1650" y2="440" stroke="#d1d5db"/>
    <text x="880" y="205" text-anchor="end" font-size="11">52</text>
    <text x="880" y="285" text-anchor="end" font-size="11">50</text>
    <text x="880" y="365" text-anchor="end" font-size="11">48</text>
    <text x="880" y="445" text-anchor="end" font-size="11">46</text>
    <text x="880" y="525" text-anchor="end" font-size="11">44</text>

    <text x="920" y="545" font-size="11">10^19</text>
    <text x="1250" y="545" font-size="11">10^20</text>
    <text x="1580" y="545" font-size="11">10^21</text>

    <polyline points="905,202 950,230 1010,270 1090,302 1180,328 1280,352 1380,380 1480,405 1560,420 1620,426"
      fill="none" stroke="#2563eb" stroke-width="3"/>
    <polyline points="905,202 950,230 1010,270 1090,302 1180,328 1230,338 1270,325 1310,305 1350,330 1390,290"
      fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <polyline points="905,202 950,230 1010,270 1090,302 1130,310 1160,290 1190,320 1210,275 1230,290"
      fill="none" stroke="#9333ea" stroke-width="2.5"/>
    <polyline points="905,202 950,230 1010,270 1040,290 1060,265 1080,285 1100,230 1115,190"
      fill="none" stroke="#fb923c" stroke-width="2.5"/>

    <g font-size="11" fill="#1e3a8a">
      <circle cx="905" cy="202" r="3"/><text x="905" y="192">52.05</text>
      <circle cx="1010" cy="270" r="3"/><text x="1010" y="260">48.57</text>
      <circle cx="1180" cy="328" r="3"/><text x="1180" y="318">46.79</text>
      <circle cx="1380" cy="380" r="3"/><text x="1380" y="370">46.07</text>
      <circle cx="1560" cy="420" r="3"/><text x="1540" y="410">45.26</text>
      <circle cx="1620" cy="426" r="3"/><text x="1560" y="438">44.69(最终最优)</text>
    </g>

    <g font-size="12">
      <rect x="1420" y="212" width="14" height="4" fill="#fb923c"/><text x="1440" y="220">3% scenarios</text>
      <rect x="1420" y="232" width="14" height="4" fill="#9333ea"/><text x="1440" y="240">12% scenarios</text>
      <rect x="1420" y="252" width="14" height="4" fill="#22c55e"/><text x="1440" y="260">30% scenarios</text>
      <rect x="1420" y="272" width="14" height="4" fill="#2563eb"/><text x="1440" y="280">100% scenarios</text>
    </g>
  </g>
  <text x="890" y="560" font-size="13.5" fill="#374151">
    <tspan x="890" dy="0">数据越少,曲线掉头(过拟合)越早;100%数据在图中算力范围内始终没有掉头,论文原句:</tspan>
    <tspan x="890" dy="18" font-style="italic">"driving quality has not saturated when using the full large-scale dataset."</tspan>
  </text>

  <!-- Footer -->
  <rect x="0" y="600" width="1700" height="60" fill="#eef2ff"/>
  <text x="850" y="635" text-anchor="middle" font-size="15" fill="#1e3a8a">这两组实验合起来说明:CoT 推理带来的提升(+6.7%)和"喂更多自监督数据仍未过拟合"是两条独立、都成立的证据链——EMMA 的规划质量既受益于推理结构,也受益于数据规模,且数据规模这条路目前还没走到头。</text>
</svg>
