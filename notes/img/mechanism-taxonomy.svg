<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1750" font-family="Helvetica, Arial, sans-serif">
  <rect width="1900" height="1750" fill="#ffffff"/>

  <!-- Title -->
  <rect x="0" y="0" width="1900" height="85" fill="#14326b"/>
  <text x="950" y="38" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="bold">机制全景图：这些论文到底是"怎么做的"</text>
  <text x="950" y="65" text-anchor="middle" fill="#cfe0ff" font-size="15">不按"回应哪个空子"分组，按"用了什么具体技术机制"分成六条轴线，每条轴线是一个光谱，论文落在光谱的不同位置</text>

  <!-- ROW 1: 路由粒度 -->
  <g>
    <rect x="50" y="110" width="1800" height="200" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="140" font-size="18" font-weight="bold" fill="#1e3a8a">① 路由粒度(专家按什么划分) —— 光谱：越左越细，越右越粗</text>
    <line x1="100" y1="230" x2="1850" y2="230" stroke="#94a3b8" stroke-width="3"/>

    <circle cx="160" cy="230" r="8" fill="#2563eb"/>
    <text x="160" y="195" text-anchor="middle" font-size="12" font-weight="bold">Token级</text>
    <text x="160" y="255" text-anchor="middle" font-size="10.5">DriveMoE</text>
    <text x="160" y="270" text-anchor="middle" font-size="10.5">ExpertAD(MoSE)</text>
    <text x="160" y="285" text-anchor="middle" font-size="10.5">SparseMoE通用</text>

    <circle cx="460" cy="230" r="8" fill="#2563eb"/>
    <text x="460" y="195" text-anchor="middle" font-size="12" font-weight="bold">技能/动作级</text>
    <text x="460" y="255" text-anchor="middle" font-size="10.5">MoEActok</text>
    <text x="460" y="270" text-anchor="middle" font-size="10.5">(动作token化</text>
    <text x="460" y="285" text-anchor="middle" font-size="10.5">按技能分专家)</text>

    <circle cx="760" cy="230" r="8" fill="#2563eb"/>
    <text x="760" y="195" text-anchor="middle" font-size="12" font-weight="bold">类别语义级</text>
    <text x="760" y="255" text-anchor="middle" font-size="10.5">SemLT3D</text>
    <text x="760" y="270" text-anchor="middle" font-size="10.5">(长尾安全类别</text>
    <text x="760" y="285" text-anchor="middle" font-size="10.5">专精路由)</text>

    <circle cx="1060" cy="230" r="8" fill="#2563eb"/>
    <text x="1060" y="195" text-anchor="middle" font-size="12" font-weight="bold">功能子任务级</text>
    <text x="1060" y="255" text-anchor="middle" font-size="10.5">ExpertAD(8专家</text>
    <text x="1060" y="270" text-anchor="middle" font-size="10.5">概念：环境/自车</text>
    <text x="1060" y="285" text-anchor="middle" font-size="10.5">状态/导航)</text>

    <circle cx="1360" cy="230" r="8" fill="#2563eb"/>
    <text x="1360" y="195" text-anchor="middle" font-size="12" font-weight="bold">传感器模态/时间级</text>
    <text x="1360" y="255" text-anchor="middle" font-size="10.5">EventDrive</text>
    <text x="1360" y="270" text-anchor="middle" font-size="10.5">(事件流时间</text>
    <text x="1360" y="285" text-anchor="middle" font-size="10.5">分辨率专家)</text>

    <circle cx="1680" cy="230" r="10" fill="#1e3a8a"/>
    <text x="1680" y="195" text-anchor="middle" font-size="12" font-weight="bold">场景级</text>
    <text x="1680" y="255" text-anchor="middle" font-size="10.5" font-weight="bold">SAMoE-VLA</text>
    <text x="1680" y="270" text-anchor="middle" font-size="10.5">(全场景一个</text>
    <text x="1680" y="285" text-anchor="middle" font-size="10.5">共享判断)</text>
  </g>

  <!-- ROW 2: 专家来源 -->
  <g>
    <rect x="50" y="330" width="1800" height="180" rx="12" fill="#eafaf0" stroke="#15803d" stroke-width="2"/>
    <text x="80" y="360" font-size="18" font-weight="bold" fill="#14532d">② 专家来源 —— 光谱：从头训练 vs 蒸馏自外部已有模型</text>
    <line x1="100" y1="440" x2="1850" y2="440" stroke="#94a3b8" stroke-width="3"/>

    <rect x="100" y="460" width="800" height="36" rx="6" fill="#dcfce7"/>
    <text x="500" y="483" text-anchor="middle" font-size="12" font-weight="bold">从头训练(专家在自己的训练数据上学出来)</text>

    <circle cx="200" cy="440" r="8" fill="#15803d"/>
    <text x="200" y="410" text-anchor="middle" font-size="11">SAMoE-VLA</text>
    <circle cx="400" cy="440" r="8" fill="#15803d"/>
    <text x="400" y="410" text-anchor="middle" font-size="11">ExpertAD</text>
    <circle cx="600" cy="440" r="8" fill="#15803d"/>
    <text x="600" y="410" text-anchor="middle" font-size="11">EventDrive</text>
    <circle cx="800" cy="440" r="8" fill="#15803d"/>
    <text x="800" y="410" text-anchor="middle" font-size="11">DriveMoE</text>

    <rect x="1000" y="460" width="800" height="36" rx="6" fill="#fef3c7"/>
    <text x="1400" y="483" text-anchor="middle" font-size="12" font-weight="bold">蒸馏自外部已训练好的模型(教师可以不是MoE)</text>

    <circle cx="1100" cy="440" r="8" fill="#ca8a04"/>
    <text x="1100" y="410" text-anchor="middle" font-size="11">PerceptDrive</text>
    <text x="1100" y="425" text-anchor="middle" font-size="9" fill="#555">(教师=VGGT/JEPA2/Wan)</text>
    <circle cx="1650" cy="440" r="10" fill="#b45309"/>
    <text x="1650" y="410" text-anchor="middle" font-size="12" font-weight="bold">SigLino</text>
    <text x="1650" y="425" text-anchor="middle" font-size="9" fill="#555">(教师=SigLIP2/DINOv3，学生=MoE)</text>

    <rect x="1550" y="455" width="320" height="48" rx="6" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="1710" y="513" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">这个位置上还没有"教师=别的驾驶MoE"的论文</text>
  </g>

  <!-- ROW 3: 路由训练信号 -->
  <g>
    <rect x="50" y="530" width="1800" height="180" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <text x="80" y="560" font-size="18" font-weight="bold" fill="#9d174d">③ 路由器怎么训练出来的 —— 光谱：越左越"自然"，越右越"有监督"</text>
    <line x1="100" y1="640" x2="1850" y2="640" stroke="#94a3b8" stroke-width="3"/>

    <circle cx="250" cy="640" r="8" fill="#be185d"/>
    <text x="250" y="610" text-anchor="middle" font-size="12" font-weight="bold">端到端梯度</text>
    <text x="250" y="665" text-anchor="middle" font-size="10.5">多数基线做法</text>
    <text x="250" y="680" text-anchor="middle" font-size="10.5">(效果最弱，消融证明)</text>

    <circle cx="650" cy="640" r="8" fill="#be185d"/>
    <text x="650" y="610" text-anchor="middle" font-size="12" font-weight="bold">强化学习(RL)</text>
    <text x="650" y="665" text-anchor="middle" font-size="10.5">MoE-GRPO</text>
    <text x="650" y="680" text-anchor="middle" font-size="10.5">(GRPO训练路由策略)</text>

    <circle cx="1050" cy="640" r="8" fill="#be185d"/>
    <text x="1050" y="610" text-anchor="middle" font-size="12" font-weight="bold">教师路由蒸馏</text>
    <text x="1050" y="665" text-anchor="middle" font-size="10.5">TGR-MoE</text>
    <text x="1050" y="680" text-anchor="middle" font-size="10.5">(dense教师的路由当伪监督)</text>

    <circle cx="1450" cy="640" r="10" fill="#9d174d"/>
    <text x="1450" y="610" text-anchor="middle" font-size="12" font-weight="bold">特权指标蒸馏</text>
    <text x="1450" y="665" text-anchor="middle" font-size="10.5" font-weight="bold">PerceptDrive</text>
    <text x="1450" y="680" text-anchor="middle" font-size="10.5">(训练时用真实碰撞率/舒适度</text>
    <text x="1450" y="695" text-anchor="middle" font-size="10.5">等指标直接监督路由器)</text>
  </g>

  <!-- ROW 4: 省计算技巧 -->
  <g>
    <rect x="50" y="730" width="1800" height="260" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="80" y="760" font-size="18" font-weight="bold" fill="#9a3412">④ 怎么真正省计算量(回应"MoE没有真正省计算量") —— 五种互相独立的具体技巧</text>

    <rect x="80" y="780" width="330" height="90" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
    <text x="245" y="800" text-anchor="middle" font-size="12.5" font-weight="bold">动态跳过专家</text>
    <text x="245" y="818" text-anchor="middle" font-size="10.5">MoDES：按层级+模态</text>
    <text x="245" y="833" text-anchor="middle" font-size="10.5">判断该不该跳，跳88%</text>
    <text x="245" y="848" text-anchor="middle" font-size="10.5">反而+10.67%精度</text>

    <rect x="430" y="780" width="330" height="90" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
    <text x="595" y="800" text-anchor="middle" font-size="12.5" font-weight="bold">参数嵌套共享</text>
    <text x="595" y="818" text-anchor="middle" font-size="10.5">UniMMAD：路由专家=</text>
    <text x="595" y="833" text-anchor="middle" font-size="10.5">共享base experts加权</text>
    <text x="595" y="848" text-anchor="middle" font-size="10.5">组合，参数-75%</text>

    <rect x="780" y="780" width="330" height="90" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
    <text x="945" y="800" text-anchor="middle" font-size="12.5" font-weight="bold">减少前向次数</text>
    <text x="945" y="818" text-anchor="middle" font-size="10.5">ColaVLA：一次决策只</text>
    <text x="945" y="833" text-anchor="middle" font-size="10.5">需2次VLM前向(而非</text>
    <text x="945" y="848" text-anchor="middle" font-size="10.5">逐层多次路由计算)</text>

    <rect x="1130" y="780" width="330" height="90" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
    <text x="1295" y="800" text-anchor="middle" font-size="12.5" font-weight="bold">Token压缩/剪枝</text>
    <text x="1295" y="818" text-anchor="middle" font-size="10.5">Driving on Registers(压缩)</text>
    <text x="1295" y="833" text-anchor="middle" font-size="10.5">Prune2Drive(剪枝)</text>
    <text x="1295" y="848" text-anchor="middle" font-size="10.5">3倍吞吐量/免训练</text>

    <rect x="1480" y="780" width="330" height="90" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
    <text x="1645" y="800" text-anchor="middle" font-size="12.5" font-weight="bold">共享码本/蒸馏到轻量学生</text>
    <text x="1645" y="818" text-anchor="middle" font-size="10.5">LinkVLA(码本，-86%推理时间)</text>
    <text x="1645" y="833" text-anchor="middle" font-size="10.5">WPT(蒸馏，推理快4.9倍)</text>
    <text x="1645" y="848" text-anchor="middle" font-size="10.5">GTR-Turbo(训练-50%/-60%)</text>

    <rect x="80" y="895" width="1730" height="75" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="945" y="920" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">关键观察：这五种技巧彼此独立、互不排斥，而且都不是"MoE专属"的——</text>
    <text x="945" y="940" text-anchor="middle" font-size="11.5" fill="#991b1b">SAMoE-VLA/PerceptDrive目前一个都没用上，这是"回应SA-MoE没真正省计算量"这个局限时最容易落地的5个现成工具箱</text>
  </g>

  <!-- ROW 5: 持续学习防遗忘 -->
  <g>
    <rect x="50" y="1010" width="1800" height="220" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="80" y="1040" font-size="18" font-weight="bold" fill="#581c87">⑤ 怎么防止路由漂移/持续学习遗忘 —— 四种各自独立的机制</text>

    <rect x="80" y="1060" width="410" height="140" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="285" y="1082" text-anchor="middle" font-size="13" font-weight="bold">On Token's Dilemma</text>
    <text x="285" y="1102" text-anchor="middle" font-size="11">按token类型(新/旧/模糊)</text>
    <text x="285" y="1118" text-anchor="middle" font-size="11">引导路由，强制模糊/旧</text>
    <text x="285" y="1134" text-anchor="middle" font-size="11">token走冻结旧专家</text>
    <text x="285" y="1160" text-anchor="middle" font-size="10" fill="#555">作用层面：路由决策本身</text>

    <rect x="520" y="1060" width="410" height="140" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="725" y="1082" text-anchor="middle" font-size="13" font-weight="bold">Spectral MoE</text>
    <text x="725" y="1102" text-anchor="middle" font-size="11">频谱正交掩码限制专家</text>
    <text x="725" y="1118" text-anchor="middle" font-size="11">更新子空间+双路由器</text>
    <text x="725" y="1134" text-anchor="middle" font-size="11">(在线+离线记忆)</text>
    <text x="725" y="1160" text-anchor="middle" font-size="10" fill="#555">作用层面：专家参数更新方式</text>

    <rect x="960" y="1060" width="410" height="140" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="1165" y="1082" text-anchor="middle" font-size="13" font-weight="bold">Blind Spot of Adaptation</text>
    <text x="1165" y="1102" text-anchor="middle" font-size="11">把适配从权重空间移到</text>
    <text x="1165" y="1118" text-anchor="middle" font-size="11">prompt空间，动态路由到</text>
    <text x="1165" y="1134" text-anchor="middle" font-size="11">LoRA知识专家委员会</text>
    <text x="1165" y="1160" text-anchor="middle" font-size="10" fill="#555">作用层面：适配发生的空间(驾驶专用)</text>

    <rect x="1400" y="1060" width="410" height="140" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="1605" y="1082" text-anchor="middle" font-size="13" font-weight="bold">Prompt-Anchored ReID</text>
    <text x="1605" y="1102" text-anchor="middle" font-size="11">冻结文本锚点保持语义稳定</text>
    <text x="1605" y="1118" text-anchor="middle" font-size="11">+新域分配新槽位、</text>
    <text x="1605" y="1134" text-anchor="middle" font-size="11">旧槽位冻结</text>
    <text x="1605" y="1160" text-anchor="middle" font-size="10" fill="#555">作用层面：专家槽位的生命周期管理</text>
  </g>

  <!-- ROW 6: 获得前瞻性 -->
  <g>
    <rect x="50" y="1250" width="1800" height="200" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="80" y="1280" font-size="18" font-weight="bold" fill="#075985">⑥ 怎么获得"向前看"的能力、但推理时零开销 —— 三种独立路线</text>

    <rect x="90" y="1300" width="560" height="120" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="370" y="1322" text-anchor="middle" font-size="13" font-weight="bold">路线A：外部预训练世界模型指导</text>
    <text x="370" y="1342" text-anchor="middle" font-size="11">WPT——世界模型只在训练时用，</text>
    <text x="370" y="1358" text-anchor="middle" font-size="11">蒸馏进轻量学生，学生推理时</text>
    <text x="370" y="1374" text-anchor="middle" font-size="11">完全不接触世界模型</text>
    <text x="370" y="1400" text-anchor="middle" font-size="10" fill="#555">前提：需要一个已训练好的世界模型当老师</text>

    <rect x="670" y="1300" width="560" height="120" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="950" y="1322" text-anchor="middle" font-size="13" font-weight="bold">路线B：训练时特权访问未来帧</text>
    <text x="950" y="1342" text-anchor="middle" font-size="11">AMap——教师在训练时真的能看到</text>
    <text x="950" y="1358" text-anchor="middle" font-size="11">未来几帧，蒸馏给只看当前帧</text>
    <text x="950" y="1374" text-anchor="middle" font-size="11">的学生</text>
    <text x="950" y="1400" text-anchor="middle" font-size="10" fill="#555">前提：训练数据必须能离线取到未来帧</text>

    <rect x="1250" y="1300" width="560" height="120" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="1530" y="1322" text-anchor="middle" font-size="13" font-weight="bold">路线C：自监督自预测</text>
    <text x="1530" y="1342" text-anchor="middle" font-size="11">PerceptDrive——模型自己预测</text>
    <text x="1530" y="1358" text-anchor="middle" font-size="11">一个不含动作信息的未来隐</text>
    <text x="1530" y="1374" text-anchor="middle" font-size="11">特征，当生成轨迹的条件</text>
    <text x="1530" y="1400" text-anchor="middle" font-size="10" fill="#555">前提：不需要外部模型，但预测质量自负</text>
  </g>

  <!-- Bottom callout -->
  <rect x="50" y="1480" width="1800" height="240" rx="10" fill="#111827"/>
  <text x="950" y="1515" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">合起来看："全程MoE+蒸馏别的MoE"要做成，相当于要在六条轴线上各自做一次新的选择</text>
  <text x="90" y="1550" fill="#e5e7eb" font-size="13">① 路由粒度：三段(感知/预测/规划)可能需要三种不同粒度，不是同一个粒度套三遍</text>
  <text x="90" y="1575" fill="#e5e7eb" font-size="13">② 专家来源：要蒸馏"别的驾驶MoE"，首先这些模型得真的开源——这是第一个要验证的硬性前提</text>
  <text x="90" y="1600" fill="#e5e7eb" font-size="13">③ 路由训练信号：PerceptDrive的"特权指标蒸馏"目前看效果最好，是三段路由器各自训练时值得优先尝试的方案</text>
  <text x="90" y="1625" fill="#e5e7eb" font-size="13">④ 省计算技巧：这五个工具箱里的任何一个，都可以直接拿来给SA-MoE的参数融合"顺便"省掉计算量，是最容易的加分项</text>
  <text x="90" y="1650" fill="#e5e7eb" font-size="13">⑤ 持续学习：如果三段路由要能随时间适应新场景，这四种机制可以分别用在不同段</text>
  <text x="90" y="1675" fill="#e5e7eb" font-size="13">⑥ 前瞻性：三条路线里，路线A(WPT式)和路线B(AMap式)比PerceptDrive自己的路线C效果数字更强，值得在预测段优先尝试</text>
  <text x="950" y="1705" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">一句话：这不是"缺一个大idea"，是"六个已经各自验证过的小技巧，还没人把它们拼在一起用在驾驶MoE上"</text>

</svg>
