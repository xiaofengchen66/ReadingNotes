<svg width="1440" height="1420" viewBox="0 0 1440 1420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #FAFAF9; }
    .card { fill: #FFFFFF; stroke: #E3E1DD; stroke-width: 1.5; }
    .title { font: 700 38px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; }
    .subtitle { font: 400 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6B7280; }
    .section-head { font: 700 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .body { font: 400 16.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #383D46; }
    .diagbox { fill: #FFFFFF; stroke-width: 2; rx: 10; }
    .diagtext { font: 700 14.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; text-anchor: middle; }
    .diagsub { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6B7280; text-anchor: middle; }
    .arrowlabel { font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8A6D3B; text-anchor: middle; }
    .badge { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EE854A"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="1420"/>

  <!-- Header -->
  <text x="60" y="64" class="title">Adaptive Mixtures of Local Experts</text>
  <text x="60" y="94" class="subtitle">Neural Computation 3, 79-87 · 1991 · Jacobs, Jordan (MIT) + Nowlan, Hinton (U. Toronto)</text>
  <text x="60" y="120" class="subtitle">cs.toronto.edu/~hinton/absps/jjnh91.pdf — not in the local repo, sourced from Hinton's homepage</text>
  <rect x="1140" y="48" width="240" height="36" rx="18" fill="#ECECEC" stroke="#797979"/>
  <text x="1260" y="71" text-anchor="middle" class="badge" fill="#4B4B4B">CODE: N/A (pre-GitHub, 1991)</text>
  <line x1="60" y1="145" x2="1380" y2="145" stroke="#E3E1DD" stroke-width="2"/>

  <!-- Row 1: PROBLEM / NOVELTY -->
  <rect class="card" x="60" y="170" width="640" height="310" rx="14"/>
  <text x="88" y="212" class="section-head" fill="#D65F5F">PROBLEM</text>
  <text x="88" y="248" class="body">– Backprop on ONE network for multiple subtasks</text>
  <text x="100" y="270" class="body">causes strong interference → slow learning,</text>
  <text x="100" y="292" class="body">poor generalization.</text>
  <text x="88" y="326" class="body">– Prior gated multi-expert systems used a LINEAR</text>
  <text x="100" y="348" class="body">BLEND error (Eq.1.1): each expert must cancel</text>
  <text x="100" y="370" class="body">the residual left by all the others.</text>
  <text x="88" y="404" class="body">– This "cooperative" error tightly couples experts —</text>
  <text x="100" y="426" class="body">many experts end up used for every case.</text>

  <rect class="card" x="740" y="170" width="640" height="310" rx="14"/>
  <text x="768" y="212" class="section-head" fill="#4878D0">NOVELTY</text>
  <text x="768" y="248" class="body">– Redefine the error as COMPETITIVE: imagine the</text>
  <text x="780" y="270" class="body">gate stochastically picks ONE expert per case;</text>
  <text x="780" y="292" class="body">take the expected squared error (Eq.1.2).</text>
  <text x="768" y="326" class="body">– Refine into a negative-log Gaussian-mixture</text>
  <text x="780" y="348" class="body">probability (Eq.1.3) — literally where "Mixture"</text>
  <text x="780" y="370" class="body">in Mixture of Experts comes from.</text>
  <text x="768" y="404" class="body">– Each expert now optimizes the WHOLE output for</text>
  <text x="780" y="426" class="body">its cases, not a residual — no longer entangled</text>
  <text x="780" y="448" class="body">with other experts' weights.</text>

  <!-- Row 2: ARCHITECTURE (Fig. 1) -->
  <rect class="card" x="60" y="510" width="1320" height="420" rx="14"/>
  <text x="88" y="552" class="section-head" fill="#EE854A">CORE IDEA — ARCHITECTURE (Fig. 1)</text>

  <!-- output box -->
  <rect class="diagbox" x="540" y="580" width="160" height="50" stroke="#EE854A"/>
  <text x="620" y="610" class="diagtext">output o</text>

  <!-- selector node -->
  <circle cx="620" cy="672" r="36" fill="#FFFFFF" stroke="#EE854A" stroke-width="2.5"/>
  <text x="620" y="668" text-anchor="middle" font-size="11.5" font-weight="700" fill="#EE854A">1-of-n</text>
  <text x="620" y="682" text-anchor="middle" font-size="11.5" font-weight="700" fill="#EE854A">selector</text>
  <line x1="620" y1="636" x2="620" y2="630" stroke="#EE854A" stroke-width="2.5" marker-end="url(#arrow4)"/>

  <!-- expert + gating row -->
  <rect class="diagbox" x="140" y="730" width="170" height="80" stroke="#4878D0"/>
  <text x="225" y="765" class="diagtext">Expert Network 1</text>
  <text x="225" y="785" class="diagsub">linear decision surface</text>

  <rect class="diagbox" x="330" y="730" width="170" height="80" stroke="#4878D0"/>
  <text x="415" y="765" class="diagtext">Expert Network 2</text>
  <text x="415" y="785" class="diagsub">linear decision surface</text>

  <rect class="diagbox" x="520" y="730" width="170" height="80" stroke="#4878D0"/>
  <text x="605" y="765" class="diagtext">Expert Network 3</text>
  <text x="605" y="785" class="diagsub">linear decision surface</text>

  <rect class="diagbox" x="750" y="730" width="190" height="80" stroke="#956CB4"/>
  <text x="845" y="765" class="diagtext">Gating Network</text>
  <text x="845" y="785" class="diagsub">softmax p_j = e^xj / Σe^xi</text>

  <!-- arrows experts/gating -> selector -->
  <line x1="240" y1="730" x2="595" y2="700" stroke="#4878D0" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <line x1="430" y1="730" x2="605" y2="705" stroke="#4878D0" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <line x1="605" y1="730" x2="614" y2="708" stroke="#4878D0" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <line x1="830" y1="730" x2="645" y2="695" stroke="#956CB4" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="760" y="700" class="arrowlabel" fill="#7A5591">p1, p2, p3</text>

  <!-- input box -->
  <rect class="diagbox" x="530" y="850" width="180" height="50" stroke="#797979"/>
  <text x="620" y="880" class="diagtext">Input x</text>

  <!-- arrows input -> experts/gating -->
  <line x1="560" y1="850" x2="260" y2="810" stroke="#797979" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <line x1="590" y1="850" x2="440" y2="810" stroke="#797979" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <line x1="620" y1="850" x2="615" y2="810" stroke="#797979" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <line x1="670" y1="850" x2="830" y2="810" stroke="#797979" stroke-width="1.8" marker-end="url(#arrow4)"/>

  <text x="88" y="918" class="body" fill="#6B7280">The selector picks ONE expert per case according to gate probabilities — competing, not blending, is what drives specialization.</text>

  <!-- Row 3: HARDEST PART / EVIDENCE -->
  <rect class="card" x="60" y="940" width="640" height="330" rx="14"/>
  <text x="88" y="982" class="section-head" fill="#956CB4">HARDEST PART</text>
  <text x="88" y="1018" class="body">– Not engineering scale — the experiment is a tiny</text>
  <text x="100" y="1040" class="body">75-speaker vowel task with experts restricted to</text>
  <text x="100" y="1062" class="body">linear decision surfaces.</text>
  <text x="88" y="1096" class="body">– The real difficulty is Sec.2's conceptual leap:</text>
  <text x="100" y="1118" class="body">reframing supervised MoE as input-conditioned</text>
  <text x="100" y="1140" class="body">competitive learning / Gaussian mixture models.</text>
  <text x="88" y="1174" class="body">– Eq.1.2 vs Eq.1.3: only Eq.1.3's posterior-style</text>
  <text x="100" y="1196" class="body">weighting makes the best-fitting expert adapt</text>
  <text x="100" y="1218" class="body">FASTEST early on, not slowest.</text>

  <rect class="card" x="740" y="940" width="640" height="330" rx="14"/>
  <text x="768" y="982" class="section-head" fill="#4C8C5B">EVIDENCE &amp; HISTORICAL NOTE</text>
  <text x="768" y="1018" class="body">– Mixtures of 4/8 experts match backprop nets'</text>
  <text x="780" y="1040" class="body">accuracy exactly (88%/90% train/test, Table 1) but</text>
  <text x="780" y="1062" class="body">converge in about HALF the epochs (p≫0.999).</text>
  <text x="768" y="1096" class="body">– Only 2-3 of 4-8 experts end up active every run</text>
  <text x="780" y="1118" class="body">("mixing proportions effectively 0") — framed as a</text>
  <text x="780" y="1140" class="body">FEATURE here ("uses as few experts as it can").</text>
  <text x="768" y="1174" class="body">– Modern MoE treats the same phenomenon (load</text>
  <text x="780" y="1196" class="body">imbalance / expert collapse) as a BUG, fixed with</text>
  <text x="780" y="1218" class="body">auxiliary balancing losses (Switch Transformer+).</text>

  <!-- Footer: code status -->
  <rect x="60" y="1284" width="1320" height="96" rx="14" fill="#ECECEC" stroke="#797979"/>
  <text x="88" y="1316" class="section-head" fill="#4B4B4B">CODE / GITHUB</text>
  <text x="88" y="1344" class="body">None, and none will ever exist — 1991 predates GitHub/arXiv-era code sharing entirely. Only the original PDF is available</text>
  <text x="88" y="1366" class="body">(via Hinton's homepage). Read this paper for the concept (gate, router, competitive specialization), not for reproduction.</text>
</svg>
