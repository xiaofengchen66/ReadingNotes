<svg width="1440" height="1460" viewBox="0 0 1440 1460" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #FAFAF9; }
    .card { fill: #FFFFFF; stroke: #E3E1DD; stroke-width: 1.5; }
    .title { font: 700 40px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; }
    .subtitle { font: 400 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6B7280; }
    .section-head { font: 700 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .body { font: 400 16.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #383D46; }
    .diagbox { fill: #FFFFFF; stroke-width: 2; rx: 10; }
    .diagtext { font: 700 13.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; text-anchor: middle; }
    .diagsub { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6B7280; text-anchor: middle; }
    .panellabel { font: 700 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #383D46; }
    .arrowlabel { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8A6D3B; text-anchor: middle; }
    .badge { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4878D0"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EE854A"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#797979"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="1460"/>

  <!-- Header -->
  <text x="60" y="64" class="title">WA-JEPA</text>
  <text x="60" y="94" class="subtitle">Rethinking the Video JEPA Paradigm for World-Action Modeling in Autonomous Driving · arXiv 2026</text>
  <text x="60" y="118" class="subtitle">Wang, Xiang, Zhou, Wang, Huang et al. (14 authors) · Afari Intelligent Drive · arXiv:2608.20974</text>
  <rect x="1030" y="46" width="350" height="36" rx="18" fill="#E1F0E3" stroke="#4C8C5B"/>
  <text x="1205" y="69" text-anchor="middle" class="badge" fill="#2F6B3D">CODE: RELEASED, WEIGHTS (39★)</text>
  <line x1="60" y1="142" x2="1380" y2="142" stroke="#E3E1DD" stroke-width="2"/>

  <!-- Row 1: PROBLEM / NOVELTY -->
  <rect class="card" x="60" y="162" width="640" height="320" rx="14"/>
  <text x="88" y="204" class="section-head" fill="#D65F5F">PROBLEM</text>
  <text x="88" y="240" class="body">– VLA (language-based) reasoning suffers a severe</text>
  <text x="100" y="262" class="body">supervision deficit; WAM (video-generation-based)</text>
  <text x="100" y="284" class="body">has semantically weak VAE-compressed latents.</text>
  <text x="88" y="318" class="body">– V-JEPA has rich self-supervised representations,</text>
  <text x="100" y="340" class="body">but random-mask completion + deterministic</text>
  <text x="100" y="362" class="body">regression + vision-only don't match planning's needs.</text>
  <text x="88" y="396" class="body">– Prior JEPA-for-driving (Drive-JEPA) still bolts on a</text>
  <text x="100" y="418" class="body">SEPARATE downstream trajectory planner.</text>

  <rect class="card" x="740" y="162" width="640" height="320" rx="14"/>
  <text x="768" y="204" class="section-head" fill="#4878D0">NOVELTY</text>
  <text x="768" y="240" class="body">– Not a new JEPA — a targeted 3-part surgery on</text>
  <text x="780" y="262" class="body">V-JEPA's training objective, each independently</text>
  <text x="780" y="284" class="body">ablated: causal future mask, flow matching, joint</text>
  <text x="780" y="306" class="body">world-action modeling.</text>
  <text x="768" y="340" class="body">– First to jointly predict future SCENE latents and</text>
  <text x="780" y="362" class="body">future TRAJECTORY in ONE shared flow predictor,</text>
  <text x="780" y="384" class="body">not a cascaded scene-predictor-then-planner.</text>
  <text x="768" y="418" class="body">– Zero-shot closed-loop validation (HUGSIM), not</text>
  <text x="780" y="440" class="body">just open-loop benchmark numbers.</text>

  <!-- Row 2: ARCHITECTURE -->
  <rect class="card" x="60" y="512" width="1320" height="450" rx="14"/>
  <text x="88" y="554" class="section-head" fill="#EE854A">CORE IDEA — TWO-STAGE ARCHITECTURE (Fig. 2)</text>

  <!-- Stage 1 -->
  <text x="88" y="588" class="panellabel">Stage 1 — Hybrid Future-Masked Pre-training (nuPlan videos, no action supervision)</text>

  <rect class="diagbox" x="90" y="602" width="190" height="65" stroke="#4878D0"/>
  <text x="185" y="628" class="diagtext">Multi-view video</text>
  <text x="185" y="646" class="diagsub">history frames X(1:H)</text>

  <rect class="diagbox" x="320" y="602" width="250" height="65" stroke="#4878D0"/>
  <text x="445" y="624" class="diagtext">Online Encoder (V-JEPA2 ViT-L)</text>
  <text x="445" y="642" class="diagsub">hybrid future mask:</text>
  <text x="445" y="656" class="diagsub">full-mask + patch-mask</text>

  <rect class="diagbox" x="610" y="602" width="220" height="65" stroke="#4878D0"/>
  <text x="720" y="628" class="diagtext">Latent Flow</text>
  <text x="720" y="646" class="diagtext">Predictor</text>

  <rect class="diagbox" x="870" y="602" width="230" height="65" stroke="#4878D0"/>
  <text x="985" y="628" class="diagtext">Predicted Future</text>
  <text x="985" y="646" class="diagtext">Scene Latent</text>

  <line x1="280" y1="634" x2="316" y2="634" stroke="#4878D0" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="570" y1="634" x2="606" y2="634" stroke="#4878D0" stroke-width="2" marker-end="url(#arrowA)"/>
  <line x1="830" y1="634" x2="866" y2="634" stroke="#4878D0" stroke-width="2" marker-end="url(#arrowA)"/>

  <rect class="diagbox" x="1150" y="602" width="190" height="65" stroke="#797979" stroke-dasharray="4,3"/>
  <text x="1245" y="624" class="diagtext">EMA Target</text>
  <text x="1245" y="642" class="diagtext">Encoder</text>
  <text x="1245" y="658" class="diagsub" font-size="10">(clean future target)</text>

  <line x1="1150" y1="634" x2="1104" y2="634" stroke="#797979" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="1128" y="680" class="arrowlabel" fill="#6B7280">supervises</text>
  <text x="1128" y="694" class="arrowlabel" fill="#6B7280">(stop-grad)</text>

  <!-- Stage 2 -->
  <text x="88" y="760" class="panellabel">Stage 2 — Joint World-Action Modeling (NAVSIM, initialized from Stage 1)</text>

  <line x1="445" y1="667" x2="445" y2="778" stroke="#8A6D3B" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arrowGray)"/>
  <text x="530" y="725" class="arrowlabel" fill="#8A6D3B">context tokens Z_ctx reused</text>

  <rect class="diagbox" x="90" y="778" width="230" height="75" stroke="#956CB4"/>
  <text x="205" y="808" class="diagtext">Historical actions</text>
  <text x="205" y="826" class="diagtext">+ ego state</text>

  <rect class="diagbox" x="360" y="778" width="290" height="75" stroke="#956CB4"/>
  <text x="505" y="804" class="diagtext">Joint Future-Action</text>
  <text x="505" y="822" class="diagtext">Flow Predictor</text>
  <text x="505" y="840" class="diagsub">denoises scene + action tokens together</text>

  <line x1="320" y1="815" x2="356" y2="815" stroke="#956CB4" stroke-width="2" marker-end="url(#arrowB)"/>

  <rect class="diagbox" x="690" y="778" width="220" height="75" stroke="#956CB4"/>
  <text x="800" y="808" class="diagtext">Future Scene Latent</text>
  <text x="800" y="826" class="diagtext">(aux loss)</text>

  <rect class="diagbox" x="950" y="778" width="240" height="75" stroke="#6ACC64"/>
  <text x="1070" y="805" class="diagtext">Future Trajectory</text>
  <text x="1070" y="823" class="diagsub">8 steps @ 2Hz</text>
  <text x="1070" y="839" class="diagsub" font-weight="700" fill="#4C8C5B">← used at inference</text>

  <line x1="650" y1="805" x2="686" y2="805" stroke="#956CB4" stroke-width="1.8" marker-end="url(#arrowB)"/>
  <path d="M 650,835 C 670,875 920,875 946,835" fill="none" stroke="#6ACC64" stroke-width="2.2" marker-end="url(#arrowB)"/>

  <text x="88" y="915" class="body" fill="#6B7280">At inference: only the Future Trajectory output is used — no future images or ground-truth actions needed, just flow-matching sampling from noise.</text>

  <!-- Row 3: HARDEST PART / EVIDENCE -->
  <rect class="card" x="60" y="982" width="640" height="340" rx="14"/>
  <text x="88" y="1024" class="section-head" fill="#956CB4">HARDEST PART</text>
  <text x="88" y="1060" class="body">– Not JEPA itself (predict features, not pixels) —</text>
  <text x="100" y="1082" class="body">verifying WHY each of the 3 changes is necessary,</text>
  <text x="100" y="1104" class="body">not cosmetic, requires reading ablations line by line.</text>
  <text x="88" y="1138" class="body">– PDMS/EPDMS and their sub-metrics (NC/DAC/TTC/</text>
  <text x="100" y="1160" class="body">Comf. etc.) are a prerequisite the paper assumes</text>
  <text x="100" y="1182" class="body">readers already know (defined only in Appendix D).</text>
  <text x="88" y="1216" class="body">– No dedicated Limitations section — you have to</text>
  <text x="100" y="1238" class="body">hunt for gaps yourself (4s horizon only, HUGSIM is</text>
  <text x="100" y="1260" class="body">still a simulator, sim-to-real gap undiscussed).</text>

  <rect class="card" x="740" y="982" width="640" height="340" rx="14"/>
  <text x="768" y="1024" class="section-head" fill="#4C8C5B">EVIDENCE</text>
  <text x="768" y="1060" class="body">– NAVSIM-v2 EPDMS 91.7 (SOTA, +1.3~1.6 over best</text>
  <text x="780" y="1082" class="body">baselines); zero-shot closed-loop HUGSIM (436</text>
  <text x="780" y="1104" class="body">unseen scenarios) HD-Score 0.4462 (SOTA, was 0.3252).</text>
  <text x="768" y="1138" class="body">– Ablations: no-Stage1=89.5 → +patch-mask=91.0 →</text>
  <text x="780" y="1160" class="body">+full-mask=91.3 → both=91.7. Every design choice</text>
  <text x="780" y="1182" class="body">contributes positively and independently.</text>
  <text x="768" y="1216" class="body">– Flow matching vs. regression: directional-similarity</text>
  <text x="780" y="1238" class="body">collapse gap 0.30→0.10; change-magnitude collapse</text>
  <text x="780" y="1260" class="body">0.45→0.80 (closer to 1 is better).</text>

  <!-- Presenting note banner -->
  <rect x="60" y="1342" width="1320" height="100" rx="14" fill="#FCEFD8" stroke="#D89B3C"/>
  <text x="88" y="1374" class="section-head" fill="#95661C">⚠ IMPORTANT WHEN PRESENTING</text>
  <text x="88" y="1402" class="body">WA-JEPA has NO MoE / expert-routing component. "MoE"/"mixture"/"expert" appear only in the reference list (other papers).</text>
  <text x="88" y="1424" class="body">"JEPA + context-based expert routing" is a proposed future direction, not something this paper did — keep the two separate.</text>
</svg>
