<svg width="1440" height="1420" viewBox="0 0 1440 1420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #FAFAF9; }
    .card { fill: #FFFFFF; stroke: #E3E1DD; stroke-width: 1.5; }
    .title { font: 700 40px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; }
    .subtitle { font: 400 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6B7280; }
    .section-head { font: 700 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .body { font: 400 16.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #383D46; }
    .diagbox { fill: #FFFFFF; stroke-width: 2; rx: 10; }
    .diagtext { font: 700 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2430; text-anchor: middle; }
    .diagsub { font: 400 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6B7280; text-anchor: middle; }
    .arrowlabel { font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8A6D3B; text-anchor: middle; }
    .badge { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#EE854A"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="1420"/>

  <!-- Header -->
  <text x="60" y="66" class="title">UniAD</text>
  <text x="60" y="96" class="subtitle">Planning-oriented Autonomous Driving · CVPR 2023 Best Paper · OpenDriveLab / Shanghai AI Lab</text>
  <text x="60" y="122" class="subtitle">arXiv:2212.10156</text>
  <rect x="1140" y="48" width="240" height="36" rx="18" fill="#E1F0E3" stroke="#4C8C5B"/>
  <text x="1260" y="71" text-anchor="middle" class="badge" fill="#2F6B3D">CODE: RELEASED &amp; USABLE</text>
  <line x1="60" y1="145" x2="1380" y2="145" stroke="#E3E1DD" stroke-width="2"/>

  <!-- Row 1: PROBLEM / NOVELTY -->
  <rect class="card" x="60" y="170" width="640" height="310" rx="14"/>
  <text x="88" y="212" class="section-head" fill="#D65F5F">PROBLEM</text>
  <text x="88" y="248" class="body">– Classic modular AD pipeline (separate models</text>
  <text x="100" y="270" class="body">per task) suffers info loss, error accumulation,</text>
  <text x="100" y="292" class="body">feature misalignment across stages.</text>
  <text x="88" y="326" class="body">– Naive multi-task learning (shared backbone +</text>
  <text x="100" y="348" class="body">task heads) is efficient but causes "negative</text>
  <text x="100" y="370" class="body">transfer" between unrelated tasks.</text>
  <text x="88" y="404" class="body">– Prior end-to-end works skip perception</text>
  <text x="100" y="426" class="body">supervision (weak safety/interpretability) or</text>
  <text x="100" y="448" class="body">only partially unify modules, none planning-first.</text>

  <rect class="card" x="740" y="170" width="640" height="310" rx="14"/>
  <text x="768" y="212" class="section-head" fill="#4878D0">NOVELTY</text>
  <text x="768" y="248" class="body">– "Planning-oriented" philosophy: every preceding</text>
  <text x="780" y="270" class="body">task is chosen/optimized because it helps final</text>
  <text x="780" y="292" class="body">planning, not for its own accuracy.</text>
  <text x="768" y="326" class="body">– Connect all tasks via one interface: learnable</text>
  <text x="780" y="348" class="body">queries, not boxes/rasters — larger receptive</text>
  <text x="780" y="370" class="body">field, flexible agent-agent/agent-map modeling.</text>
  <text x="768" y="404" class="body">– First work to jointly train detection+tracking,</text>
  <text x="780" y="426" class="body">mapping, motion, occupancy AND planning end-to-</text>
  <text x="780" y="448" class="body">end in one network (Table 1 taxonomy).</text>

  <!-- Row 2: ARCHITECTURE -->
  <rect class="card" x="60" y="510" width="1320" height="410" rx="14"/>
  <text x="88" y="552" class="section-head" fill="#EE854A">CORE IDEA — QUERY-CONNECTED PIPELINE (Fig. 2)</text>

  <rect class="diagbox" x="88" y="650" width="150" height="110" stroke="#797979"/>
  <text x="163" y="698" class="diagtext">Multi-cam</text>
  <text x="163" y="716" class="diagtext">Images</text>
  <text x="163" y="738" class="diagsub">6 surround views</text>

  <rect class="diagbox" x="268" y="650" width="160" height="110" stroke="#797979"/>
  <text x="348" y="698" class="diagtext">BEV Encoder</text>
  <text x="348" y="716" class="diagsub">(BEVFormer)</text>
  <text x="348" y="734" class="diagsub">→ feature B</text>

  <rect class="diagbox" x="458" y="650" width="210" height="110" stroke="#4878D0"/>
  <text x="563" y="690" class="diagtext">TrackFormer +</text>
  <text x="563" y="708" class="diagtext">MapFormer</text>
  <text x="563" y="728" class="diagsub">agent queries QA(+ego)</text>
  <text x="563" y="744" class="diagsub">map queries QM</text>

  <rect class="diagbox" x="698" y="650" width="180" height="110" stroke="#4878D0"/>
  <text x="788" y="698" class="diagtext">MotionFormer</text>
  <text x="788" y="718" class="diagsub">agent-agent/map/goal attn</text>
  <text x="788" y="736" class="diagsub">→ per-agent trajectories</text>

  <rect class="diagbox" x="908" y="650" width="170" height="110" stroke="#4878D0"/>
  <text x="993" y="698" class="diagtext">OccFormer</text>
  <text x="993" y="718" class="diagsub">BEV + agent feat</text>
  <text x="993" y="736" class="diagsub">→ instance occupancy</text>

  <rect class="diagbox" x="1108" y="650" width="232" height="110" stroke="#EE854A"/>
  <text x="1224" y="690" class="diagtext">Planner</text>
  <text x="1224" y="710" class="diagsub">plan query = ego-query + cmd</text>
  <text x="1224" y="726" class="diagsub">attends BEV → waypoints</text>
  <text x="1224" y="742" class="diagsub">Newton's opt. avoids occupancy</text>

  <line x1="238" y1="705" x2="268" y2="705" stroke="#797979" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="428" y1="705" x2="458" y2="705" stroke="#797979" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="668" y1="705" x2="698" y2="705" stroke="#4878D0" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="878" y1="705" x2="908" y2="705" stroke="#4878D0" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="1078" y1="705" x2="1108" y2="705" stroke="#EE854A" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <text x="88" y="800" class="body" fill="#6B7280">Simplified: plan query also attends BEV feature B directly, and OccFormer also reads BEV B as scene input (not just MotionFormer output) — see 图解读 for the full wiring.</text>
  <text x="88" y="828" class="body" fill="#6B7280">Two-stage training: Stage 1 — perception only (Track+Map), 6 epochs. Stage 2 — full end-to-end with all 5 modules jointly, 20 epochs.</text>
  <text x="88" y="864" class="body" fill="#6B7280">Queries Q (not bounding boxes) are the interface between every stage — the single design choice the whole paper's "flexibility" claim rests on.</text>

  <!-- Row 3: HARDEST PART / EVIDENCE -->
  <rect class="card" x="60" y="940" width="640" height="320" rx="14"/>
  <text x="88" y="982" class="section-head" fill="#956CB4">HARDEST PART</text>
  <text x="88" y="1018" class="body">– Not the transformer modules themselves (DETR-</text>
  <text x="100" y="1040" class="body">style queries, deformable attention are reused) —</text>
  <text x="100" y="1062" class="body">it's Table 2's 12-row ablation isolating each</text>
  <text x="100" y="1084" class="body">module's marginal effect on the FINAL planning</text>
  <text x="100" y="1106" class="body">metric, not just its own task metric.</text>
  <text x="88" y="1140" class="body">– Table 9's counter-intuitive result: cross-</text>
  <text x="100" y="1162" class="body">attention WITHOUT a locality mask (Exp.2) is</text>
  <text x="100" y="1184" class="body">slightly worse than no attention at all (Exp.1) —</text>
  <text x="100" y="1206" class="body">mask discipline matters more than "add attention."</text>

  <rect class="card" x="740" y="940" width="640" height="320" rx="14"/>
  <text x="768" y="982" class="section-head" fill="#4C8C5B">EVIDENCE</text>
  <text x="768" y="1018" class="body">– Full pipeline (Exp.12) vs naive MTL (Exp.0):</text>
  <text x="780" y="1040" class="body">-15.2% minADE, -17.0% minFDE, -3.2 MR(%),</text>
  <text x="780" y="1062" class="body">-0.15m avg. planning L2, -0.51 avg. Col.(%).</text>
  <text x="768" y="1096" class="body">– Per-module SOTA: tracking AMOTA 0.359 (+6.5 vs</text>
  <text x="780" y="1118" class="body">MUTR3D); motion minADE 0.71m (-38.3% vs PnPNet);</text>
  <text x="780" y="1140" class="body">planning L2 1.03m / Col. 0.31% (-51%/-56% vs ST-P3).</text>
  <text x="768" y="1174" class="body">– NOT SOTA on raw perception (Drivable IoU 69.1 vs</text>
  <text x="780" y="1196" class="body">BEVFormer's 77.5) — authors: serves planning, not</text>
  <text x="780" y="1216" class="body">perception accuracy for its own sake.</text>

  <!-- Footer: code status -->
  <rect x="60" y="1284" width="1320" height="96" rx="14" fill="#E1F0E3" stroke="#4C8C5B"/>
  <text x="88" y="1316" class="section-head" fill="#2F6B3D">CODE / GITHUB</text>
  <text x="88" y="1344" class="body">github.com/OpenDriveLab/UniAD — fully released &amp; actively maintained (UniAD 2.0, Oct 2025), 4.7k+ stars. Full training/eval</text>
  <text x="88" y="1366" class="body">pipeline + checkpoints for nuScenes; can clone and run today — the paper's own "code and models are public" claim holds up.</text>
</svg>
