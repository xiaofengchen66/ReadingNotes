<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 920" font-family="Helvetica, Arial, sans-serif">
  <rect width="1700" height="920" fill="#ffffff"/>

  <!-- Title -->
  <rect x="0" y="0" width="1700" height="72" fill="#14326b"/>
  <text x="850" y="34" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="bold">GAIA-2: A Controllable Multi-View Generative World Model</text>
  <text x="850" y="58" text-anchor="middle" fill="#cfe0ff" font-size="15">Wayve(UK)· arXiv 2503.20523 · from "generate believable video" to "generate a consistent, controllable scene"</text>

  <!-- Panel A: GAIA-1 vs GAIA-2 evolution -->
  <text x="30" y="110" fill="#111827" font-size="19" font-weight="bold">What Changed vs. GAIA-1</text>

  <g font-size="13.5">
    <rect x="30" y="128" width="640" height="34" fill="#1e3a8a"/>
    <text x="50" y="151" fill="#ffffff" font-weight="bold"></text>
    <rect x="30" y="128" width="210" height="34" fill="#1e3a8a"/>
    <text x="340" y="151" text-anchor="middle" fill="#ffffff" font-weight="bold">GAIA-1 (2023)</text>
    <text x="555" y="151" text-anchor="middle" fill="#ffffff" font-weight="bold">GAIA-2 (2025)</text>

    <rect x="30" y="162" width="210" height="40" fill="#f3f4f6"/><text x="40" y="187" font-weight="bold">Generation</text>
    <rect x="240" y="162" width="200" height="40" fill="#fff0e6"/><text x="340" y="187" text-anchor="middle">Discrete token, autoregressive</text>
    <rect x="440" y="162" width="230" height="40" fill="#eafaf0"/><text x="555" y="187" text-anchor="middle">Continuous latent, flow matching</text>

    <rect x="30" y="202" width="210" height="40" fill="#ffffff"/><text x="40" y="227" font-weight="bold">World model</text>
    <rect x="240" y="202" width="200" height="40" fill="#fff0e6"/><text x="340" y="227" text-anchor="middle">6.5B params</text>
    <rect x="440" y="202" width="230" height="40" fill="#eafaf0"/><text x="555" y="227" text-anchor="middle">8.4B params, 22 blocks</text>

    <rect x="30" y="242" width="210" height="40" fill="#f3f4f6"/><text x="40" y="267" font-weight="bold">Cameras</text>
    <rect x="240" y="242" width="200" height="40" fill="#fff0e6"/><text x="340" y="267" text-anchor="middle">single / basic multi-view</text>
    <rect x="440" y="242" width="230" height="40" fill="#eafaf0"/><text x="555" y="267" text-anchor="middle">up to 5, spatiotemporal-consistent</text>

    <rect x="30" y="282" width="210" height="40" fill="#ffffff"/><text x="40" y="307" font-weight="bold">Conditioning</text>
    <rect x="240" y="282" width="200" height="40" fill="#fff0e6"/><text x="340" y="307" text-anchor="middle">text + 2 action scalars</text>
    <rect x="440" y="282" width="230" height="40" fill="#eafaf0"/><text x="555" y="300" text-anchor="middle" font-size="12">actions · 3D boxes · metadata</text>
    <text x="555" y="316" text-anchor="middle" font-size="12">CLIP / scenario embeddings</text>

    <rect x="30" y="322" width="210" height="40" fill="#f3f4f6"/><text x="40" y="347" font-weight="bold">Data</text>
    <rect x="240" y="322" width="200" height="40" fill="#fff0e6"/><text x="340" y="347" text-anchor="middle">4,700 hr, London only</text>
    <rect x="440" y="322" width="230" height="40" fill="#eafaf0"/><text x="555" y="347" text-anchor="middle">25M clips, UK/US/Germany</text>

    <rect x="30" y="128" width="640" height="234" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  </g>
  <text x="30" y="388" font-size="13" fill="#b91c1c" font-weight="bold">Unchanged: still NOT real-time — same core limitation carried over, unresolved in GAIA-2.</text>

  <!-- Panel B: conditioning mechanism -->
  <text x="760" y="110" fill="#111827" font-size="19" font-weight="bold">Two Conditioning Pathways (why two different mechanisms)</text>

  <g font-size="13">
    <rect x="760" y="135" width="430" height="110" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
    <text x="975" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">AdaLN ← Action (speed, curvature)</text>
    <text x="975" y="186" text-anchor="middle" font-size="12.5">Global condition — affects ALL spatial tokens</text>
    <text x="975" y="206" text-anchor="middle" font-size="12.5">injected into every transformer block's norm</text>
    <text x="975" y="226" text-anchor="middle" font-size="12.5">symmetric-log encoded, scaled to [-1,1]</text>

    <rect x="1230" y="135" width="430" height="110" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
    <text x="1445" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#9d174d">Cross-Attention ← Structured scene</text>
    <text x="1445" y="186" text-anchor="middle" font-size="12.5">Local condition — affects specific regions</text>
    <text x="1445" y="206" text-anchor="middle" font-size="12.5">3D agent boxes, road semantics, metadata,</text>
    <text x="1445" y="226" text-anchor="middle" font-size="12.5">CLIP / scenario embeddings</text>
  </g>

  <text x="760" y="275" font-size="13.5" fill="#374151">Camera intrinsics / extrinsics / distortion are also encoded into every token — this is how multi-view consistency is achieved:</text>
  <text x="760" y="296" font-size="13.5" fill="#374151">all cameras share ONE scene latent, each view just samples it from a different camera geometry, rather than generating independently.</text>

  <!-- Flow matching diagram -->
  <text x="760" y="340" fill="#111827" font-size="17" font-weight="bold">Flow Matching: noise → target, via a straight-line path</text>
  <g font-size="13">
    <circle cx="820" cy="385" r="26" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="820" y="390" text-anchor="middle" font-size="12">noise ε</text>
    <path d="M 850 385 L 1340 385" stroke="#4b5563" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow2)"/>
    <text x="1090" y="372" text-anchor="middle" font-size="12.5">x^τ = τ·x + (1−τ)·ε  (τ: 0→1)</text>
    <circle cx="1370" cy="385" r="26" fill="#d1fae5" stroke="#15803d" stroke-width="2"/>
    <text x="1370" y="390" text-anchor="middle" font-size="12">target x</text>
  </g>
  <text x="760" y="430" font-size="13" fill="#374151">Model predicts velocity v = x − ε. τ sampled from a bimodal logit-normal (80% moderate noise, 20% near-pure noise).</text>

  <!-- Panel C: training tasks -->
  <text x="30" y="440" fill="#111827" font-size="19" font-weight="bold">Three Training Tasks (mixed per batch)</text>
  <g font-size="13.5">
    <rect x="30" y="460" width="300" height="70" rx="8" fill="#eef4ff" stroke="#2563eb"/>
    <text x="180" y="485" text-anchor="middle" font-weight="bold">From-scratch (70%)</text>
    <text x="180" y="508" text-anchor="middle" font-size="12">no context, pure condition-driven</text>

    <rect x="345" y="460" width="300" height="70" rx="8" fill="#fff0e6" stroke="#c2410c"/>
    <text x="495" y="485" text-anchor="middle" font-weight="bold">Context rollout (20%)</text>
    <text x="495" y="508" text-anchor="middle" font-size="12">continue from real frames</text>

    <rect x="660" y="460" width="300" height="70" rx="8" fill="#eafaf0" stroke="#15803d"/>
    <text x="810" y="485" text-anchor="middle" font-weight="bold">Spatial inpainting (10%)</text>
    <text x="810" y="508" text-anchor="middle" font-size="12">regenerate masked regions</text>
  </g>

  <!-- Panel D: eval metrics -->
  <text x="30" y="575" fill="#111827" font-size="19" font-weight="bold">Driving-Specific Metrics (vs. generic FID/FVD)</text>
  <g font-size="13.5">
    <rect x="30" y="595" width="1560" height="46" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="50" y="623" font-weight="bold">FDD</text>
    <text x="150" y="623">Frechet DINO Distance — DINOv2 features replace Inception; paper finds it less noisy than FID</text>
    <rect x="30" y="641" width="1560" height="46" fill="#ffffff" stroke="#9ca3af"/>
    <text x="50" y="669" font-weight="bold">FVMD</text>
    <text x="150" y="669">Frechet Video Motion Distance — compares keypoint-motion feature distributions, more aligned with human judgment of motion realism than FVD</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="740" width="1700" height="80" fill="#eef2ff"/>
  <text x="850" y="770" text-anchor="middle" font-size="15" fill="#1e3a8a">GAIA-2's real upgrade is controllability + multi-view consistency, not raw realism — and it starts framing itself as</text>
  <text x="850" y="792" text-anchor="middle" font-size="15" fill="#1e3a8a" font-style="italic">"core infrastructure in the development of safe, robust, and generalizable autonomous systems,"</text>
  <text x="850" y="814" text-anchor="middle" font-size="14" fill="#1e3a8a">a framing GAIA-3 later pushes further into a dedicated offline safety-evaluation pipeline.</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>
</svg>
